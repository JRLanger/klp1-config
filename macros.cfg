#######################################################################################################################################################################
# PRINT START / END / CANCEL
#######################################################################################################################################################################

[gcode_macro START_PRINT]
description: Heat, home, load mesh, purge
gcode:
    {% set BED_TEMP = params.BED_TEMP|default(60)|float %}
    {% set EXTRUDER_TEMP = params.EXTRUDER_TEMP|default(220)|float %}
    {% set PREHEAT = [EXTRUDER_TEMP, 150]|min %}
    {% set MESH = params.MESH|default("JRLanger") %}

    {% if params.BED_TEMP is not defined or params.EXTRUDER_TEMP is not defined %}
        DISPLAY_MESSAGE MESSAGE="WARNING: slicer did not pass temps. Using bed {BED_TEMP} / nozzle {EXTRUDER_TEMP}."
    {% endif %}

    CLEAR_PAUSE
    _PAUSE_RESET

    M117 Heating bed...
    M104 S{PREHEAT}                                     ; warm nozzle, below ooze temp
    M190 S{BED_TEMP}                                    ; sets target and waits

    M117 Homing...
    G28                                                 ; home after bed expansion

    {% if MESH in printer.bed_mesh.profiles %}
        BED_MESH_PROFILE LOAD={MESH}
    {% else %}
        DISPLAY_MESSAGE MESSAGE="WARNING: mesh profile {MESH} not found. Printing without mesh."
    {% endif %}

    M117 Heating extruder...
    M109 S{EXTRUDER_TEMP}

    M117 Purging...
    G90
    M82                                                 ; purge below uses absolute E
    G92 E0
    G1 Z5 F900                                          ; raise before travel
    G1 X2 Y20 F6000
    G1 Z0.2 F600
    G1 Y175 E15 F1500
    G1 Z0.4 F600
    G1 Y20 E30 F1500
    G1 X5 F6000
    G92 E0
    M117 Printing...

#######################################################################################################################################################################

[gcode_macro END_PRINT]
description: Heaters off, retract, park at back
gcode:
    {% set th = printer.toolhead %}
    {% set cur_z = printer.gcode_move.gcode_position.z %}
    {% set z_park = [[cur_z + 10, 200]|max, th.axis_maximum.z - 5]|min %}
    {% set z_park = [z_park, cur_z]|max %}              ; never move down

    M104 S0                                             ; heaters off first
    M140 S0
    M106 S0
    _PAUSE_RESET

    G91
    {% if printer.extruder.can_extrude %}
        G1 E-2 F1800
    {% endif %}
    G90
    G1 Z{z_park} F900
    G1 X{(th.axis_minimum.x + th.axis_maximum.x) / 2} Y{th.axis_maximum.y - 10} F6000
    M84
    M117 Print complete

#######################################################################################################################################################################

[gcode_macro CANCEL_PRINT]
description: Cancel the running print
rename_existing: CANCEL_PRINT_BASE
gcode:
    {% set th = printer.toolhead %}
    {% set cur_z = printer.gcode_move.gcode_position.z %}
    {% set z_up = [[cur_z + 10, th.axis_maximum.z - 5]|min, cur_z]|max %}
    {% set can_e = printer.extruder.can_extrude %}

    TURN_OFF_HEATERS
    M106 S0
    _PAUSE_RESET
    {% if 'idle_timeout' in printer.configfile.settings %}
        SET_IDLE_TIMEOUT TIMEOUT={printer.configfile.settings.idle_timeout.timeout}
    {% else %}
        SET_IDLE_TIMEOUT TIMEOUT=600
    {% endif %}
    CANCEL_PRINT_BASE

    G90
    {% if can_e %}
        M83
        G1 E-2 F1800
        M82
    {% endif %}
    G1 Z{z_up} F900
    G1 X10 Y{th.axis_maximum.y - 10} F6000
    M84

#######################################################################################################################################################################
# PAUSE / RESUME
# RESUME is two-stage: 1st press = reheat + purge, 2nd press = continue print.
#######################################################################################################################################################################

[gcode_macro _PAUSE_CFG]
description: Settings for PAUSE / RESUME
variable_park_x: -1              ; -1 = bed center
variable_park_y: -1              ; -1 = back (max Y minus park_margin)
variable_park_margin: 10         ; mm from max Y
variable_z_lift: 50              ; mm bed drop at pause (clamped)
variable_z_margin: 5             ; stay this far below max Z
variable_retract: 3              ; mm retracted at pause
variable_standby_drop: 60        ; C below print temp while paused (PETG: 70-80)
variable_heater_off_after: 1800  ; s until hotend fully off; 0 = never
variable_purge_x: 5
variable_purge_y: 5
variable_purge_len: 30           ; mm purged on resume (max 50)
variable_purge_speed: 300        ; mm/min
variable_prime_extra: 0.5        ; mm extra prime when back on the print
variable_beep_count: 5           ; total beeps; 0 = none
variable_beep_interval: 120      ; s between reminder beeps
gcode:

[gcode_macro PAUSE]
description: Retract, drop bed, park at back, cool to standby, beep
rename_existing: BASE_PAUSE
gcode:
    {% set cfg = printer['gcode_macro _PAUSE_CFG'] %}
    {% if not printer.pause_resume.is_paused %}
        {% set th = printer.toolhead %}
        {% set room = th.axis_maximum.z - cfg.z_margin - th.position.z %}
        {% set lift = [[params.Z|default(cfg.z_lift)|float, room]|min, 0]|max %}
        {% set px = cfg.park_x if cfg.park_x >= 0 else (th.axis_minimum.x + th.axis_maximum.x) / 2 %}
        {% set py = cfg.park_y if cfg.park_y >= 0 else th.axis_maximum.y - cfg.park_margin %}
        {% set can_e = printer.extruder.can_extrude %}
        SET_GCODE_VARIABLE MACRO=RESUME VARIABLE=zhop VALUE={lift}
        SET_GCODE_VARIABLE MACRO=RESUME VARIABLE=park_z VALUE={printer.gcode_move.gcode_position.z + lift}
        SET_GCODE_VARIABLE MACRO=RESUME VARIABLE=etemp VALUE={printer.extruder.target}
        SET_GCODE_VARIABLE MACRO=RESUME VARIABLE=fan VALUE={printer.fan.speed}
        SET_GCODE_VARIABLE MACRO=RESUME VARIABLE=retracted VALUE={cfg.retract if can_e else 0}
        SET_GCODE_VARIABLE MACRO=RESUME VARIABLE=stage VALUE=0
        SAVE_GCODE_STATE NAME=PAUSE
        BASE_PAUSE
        G91
        {% if can_e %}
            G1 E-{cfg.retract} F2100                    ; retract before anything else
        {% endif %}
        G1 Z{lift} F900                                 ; drop bed
        SAVE_GCODE_STATE NAME=PAUSEPARK
        G90
        G1 X{px} Y{py} F6000                            ; park
        {% if printer.extruder.target > 0 %}
            M104 S{[printer.extruder.target - cfg.standby_drop, 0]|max}
            M106 S255                                   ; fan helps cool nozzle
            UPDATE_DELAYED_GCODE ID=_PAUSE_COOL DURATION=5
        {% else %}
            M106 S0
        {% endif %}
        {% if cfg.heater_off_after > 0 %}
            UPDATE_DELAYED_GCODE ID=_PAUSE_HEATER_OFF DURATION={cfg.heater_off_after}
        {% endif %}
        SET_IDLE_TIMEOUT TIMEOUT=43200
        SET_GCODE_VARIABLE MACRO=_PAUSE_BEEP VARIABLE=left VALUE={cfg.beep_count}
        _PAUSE_BEEP
        DISPLAY_MESSAGE MESSAGE="Paused. RESUME = heat and purge."
    {% endif %}

[gcode_macro RESUME]
description: 1st = heat and purge, 2nd = continue print
rename_existing: BASE_RESUME
variable_zhop: 0
variable_park_z: 0
variable_etemp: 0
variable_fan: 0
variable_retracted: 0
variable_stage: 0
gcode:
    {% set cfg = printer['gcode_macro _PAUSE_CFG'] %}
    {% if printer.pause_resume.is_paused %}
        {% if stage == 0 %}
            _PAUSE_RESET
            M106 S0
            {% if etemp > 0 %}
                DISPLAY_MESSAGE MESSAGE="Heating..."
                M109 S{etemp}
            {% endif %}
            _PAUSE_PURGE
            SET_GCODE_VARIABLE MACRO=RESUME VARIABLE=stage VALUE=1
            DISPLAY_MESSAGE MESSAGE="Clean the nozzle, then RESUME again. _PAUSE_PURGE for more."
        {% else %}
            {% if 'idle_timeout' in printer.configfile.settings %}
                SET_IDLE_TIMEOUT TIMEOUT={printer.configfile.settings.idle_timeout.timeout}
            {% else %}
                SET_IDLE_TIMEOUT TIMEOUT=600
            {% endif %}
            {% if etemp > 0 %}
                M109 S{etemp}                           ; instant if already hot
            {% endif %}
            G90
            G1 Z{park_z} F900                           ; back to safe height
            RESTORE_GCODE_STATE NAME=PAUSEPARK MOVE=1 MOVE_SPEED=100
            G91
            G1 Z{-zhop} E{retracted + cfg.prime_extra} F900
            M400
            RESTORE_GCODE_STATE NAME=PAUSE MOVE=1 MOVE_SPEED=60
            M106 S{(fan * 255)|round|int}
            SET_GCODE_VARIABLE MACRO=RESUME VARIABLE=stage VALUE=0
            SET_GCODE_VARIABLE MACRO=RESUME VARIABLE=retracted VALUE=0
            BASE_RESUME
        {% endif %}
    {% endif %}

[gcode_macro _PAUSE_PURGE]
description: Purge at purge position while paused
gcode:
    {% set cfg = printer['gcode_macro _PAUSE_CFG'] %}
    {% set r = printer['gcode_macro RESUME'].retracted %}
    {% set len = [params.LENGTH|default(cfg.purge_len)|float, 45]|min %}
    {% if not printer.pause_resume.is_paused %}
        DISPLAY_MESSAGE MESSAGE="Not paused."
    {% elif not printer.extruder.can_extrude %}
        DISPLAY_MESSAGE MESSAGE="Hotend too cold to purge."
    {% else %}
        SAVE_GCODE_STATE NAME=PAUSE_PURGE
        G90
        G1 X{cfg.purge_x} Y{cfg.purge_y} F6000
        M83
        G1 E{r + len} F{cfg.purge_speed}
        G1 E-1 F2100                                    ; anti-string
        M400
        SET_GCODE_VARIABLE MACRO=RESUME VARIABLE=retracted VALUE=1
        RESTORE_GCODE_STATE NAME=PAUSE_PURGE
    {% endif %}

[gcode_macro _PAUSE_RESET]
description: Stop pause timers and reset pause stage
gcode:
    UPDATE_DELAYED_GCODE ID=_PAUSE_HEATER_OFF DURATION=0
    UPDATE_DELAYED_GCODE ID=_PAUSE_COOL DURATION=0
    UPDATE_DELAYED_GCODE ID=_PAUSE_BEEP_LOOP DURATION=0
    SET_GCODE_VARIABLE MACRO=_PAUSE_BEEP VARIABLE=left VALUE=0
    SET_GCODE_VARIABLE MACRO=RESUME VARIABLE=stage VALUE=0

[gcode_macro _PAUSE_BEEP]
variable_left: 0
gcode:
    {% set cfg = printer['gcode_macro _PAUSE_CFG'] %}
    {% if printer.pause_resume.is_paused and left > 0 %}
        {% if 'gcode_macro M300' in printer %}
            M300 S1000 P200
            G4 P150
            M300 S1000 P200
            G4 P150
            M300 S1000 P200
        {% endif %}
        SET_GCODE_VARIABLE MACRO=_PAUSE_BEEP VARIABLE=left VALUE={left - 1}
        UPDATE_DELAYED_GCODE ID=_PAUSE_BEEP_LOOP DURATION={cfg.beep_interval}
    {% endif %}

[delayed_gcode _PAUSE_BEEP_LOOP]
gcode:
    _PAUSE_BEEP

[delayed_gcode _PAUSE_COOL]
gcode:
    {% set ex = printer.extruder %}
    {% if printer.pause_resume.is_paused %}
        {% if ex.temperature <= [ex.target, 50]|max + 5 %}
            M106 S0
        {% else %}
            UPDATE_DELAYED_GCODE ID=_PAUSE_COOL DURATION=5
        {% endif %}
    {% endif %}

[delayed_gcode _PAUSE_HEATER_OFF]
gcode:
    {% if printer.pause_resume.is_paused %}
        M104 S0
        DISPLAY_MESSAGE MESSAGE="Hotend off after long pause. RESUME reheats."
    {% endif %}

