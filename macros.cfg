[gcode_macro START_PRINT]
gcode:
    {% set BED_TEMP = params.BED_TEMP|default(60)|float %}                               ; Set bed temperature, default to 60°C
    {% set EXTRUDER_TEMP = params.EXTRUDER_TEMP|default(220)|float %}                    ; Set extruder temperature, default to 220°C

    M117 Heating bed...                                                                  ; Display message
    M140 S{BED_TEMP}                                                                     ; Start heating the bed
    M190 S{BED_TEMP}                                                                     ; Wait for the bed to reach target temperature


    {% if 'x' not in printer.toolhead.homed_axes or 'y' not in printer.toolhead.homed_axes or 'z' not in printer.toolhead.homed_axes %}
    M117 Homing all axes...                                                               ; Display message
    G28                                                                                   ; Home all axes if not already homed
    {% endif %}

#    M117 Updating Bed Mesh...                                                             ; Display message
#    G30                                                                                   ; Home and perform bed mesh calibration

    M117 Heating extruder...                                                              ; Display message
    M104 S{EXTRUDER_TEMP}                                                                 ; Start heating the extruder
    M109 S{EXTRUDER_TEMP}                                                                 ; Wait for the extruder to reach target temperature

    M117 Purging extruder...                                                              ; Display message
    G92 E0                                                                                ; Reset extruder
    G1 X2 Y20 F5000                                                                       ; Move to start-line position
    G1 Z0.2 F100                                                                          ; Lower nozzle to first layer height
    G1 X2 Y175.0 Z0.2 F1500.0 E15                                                         ; Draw first purge line
    G1 X2 Y175.0 Z0.4 F5000.0                                                             ; Move up slightly
    G1 X2 Y20 Z0.4 F1500.0 E30                                                            ; Draw second purge line
    G1 X5 Y20 F5000                                                                       ; Wipe nozzle
    G92 E0                                                                                ; Reset extruder
    
    M117 Printing...                                                                      ; Display message

#######################################################################################################################################################################

[gcode_macro END_PRINT]
gcode:
    G91                                                                                   ; Switch to relative positioning
    {% if printer.extruder.temperature >= 180 %}            ; Check if nozzle is above minimum extrusion temperature
    G1 E-0.5 F1800                                                                        ; Retract filament slightly
    {% endif %}
    G1 X-2 Y-2 F3000                                                                      ; Perform a short wipe movement
    G1 Z5 F3000                                                                           ; Raise Z-axis to clear print

    M117 Cooling down and lowering bed...                                                 ; Display message
    M104 S0                                                                               ; Turn off extruder heater
    M140 S0                                                                               ; Turn off bed heater
    M106 S0                                                                               ; Turn off fan

    G90                                                                                   ; Return to absolute positioning
    G1 X107 Y200 Z200 F3000                                                               ; Move nozzle to center back position and lower the bed
    M84                                                                                   ; Disable steppers
    M117 Print complete...                                                                ; Display message

#######################################################################################################################################################################

[gcode_macro PAUSE]
rename_existing: BASE_PAUSE
gcode:
    {% set z = params.Z|default(10)|int %}                                                ; Z hop amount to lift the nozzle during pause, helping to avoid collisions with the print or unwanted filament artifacts.
    {% set e = params.E|default(1) %}
    
    {% if printer['pause_resume'].is_paused|int == 0 %}     
        SET_GCODE_VARIABLE MACRO=RESUME VARIABLE=zhop VALUE={z}                           ; Save the Z hop amount to ensure the nozzle returns to its original position when resuming the print.
        SET_GCODE_VARIABLE MACRO=RESUME VARIABLE=etemp VALUE={printer['extruder'].target} ; Set hotend temp variable for reference in resume macro
        SAVE_GCODE_STATE NAME=PAUSE                                                       ; Save current print position for resume, ensuring the print can continue seamlessly from the exact same spot.
        BASE_PAUSE                                                                        ; Pause print
        {% if (printer.gcode_move.position.z + z) < printer.toolhead.axis_maximum.z %}    ; Check that z hop doesn't exceed z max to prevent mechanical binding or nozzle collision with the gantry.
            G91                                                                           ; Relative positioning
            G1 Z{z} F900                                                                  ; Raise Z by z hop amount
        {% else %}
            { action_respond_info("Pause z hop exceeds maximum Z height.") }              ; If z max is exceeded, show message and set z hop value for resume to 0
            SET_GCODE_VARIABLE MACRO=RESUME VARIABLE=zhop VALUE=0
        {% endif %}
        G1 E-{e} F2100
        SAVE_GCODE_STATE NAME=PAUSEPARK
        G90                                                                               ; Absolute positioning
        G1 X10 Y10 F6000                                                                  ; Park toolhead at front center
        M104 S0                                                                           ; Turn off hotend
        SET_IDLE_TIMEOUT TIMEOUT=43200                                                    ; Set timeout to 12 hours
    {% endif %}
    M106 S0

#######################################################################################################################################################################

[gcode_macro RESUME]
description: Resume paused print, of course!
rename_existing: BASE_RESUME
variable_zhop: 0
variable_etemp: 0
gcode:
    {% set e = params.E|default(2.5)|float %}                                             ; Hotend prime amount (in mm)
    {% if printer['pause_resume'].is_paused|int == 1 %}
        SET_IDLE_TIMEOUT TIMEOUT={printer.configfile.settings.idle_timeout.timeout}       ; Set timeout back to configured value
        {% if etemp > 0 %}
            M109 S{etemp|int}                                                             ; Wait for hotend to heat back up
        {% endif %}
        RESTORE_GCODE_STATE NAME=PAUSEPARK MOVE=1 MOVE_SPEED=100                          ; Return to parked position in case toolhead was moved during pause (otherwise the return z hop can error)  
        G91                                                                               ; Relative extruder positioning              
        M83                                                                               ; Restore extruder to relative mode                                                                                  
        {% if printer[printer.toolhead.extruder].temperature >= printer.configfile.settings.extruder.min_extrude_temp %}                                                
            G1 Z{zhop * -1} E{e} F900                                                     ; Prime nozzle by E, lower Z back down
        {% else %}                      
            G1 Z{zhop * -1} F900                                                          ; Lower Z back down without priming (just in case we are testing the macro with a cold hotend)
        {% endif %}
        M400                                                                                                                        
        RESTORE_GCODE_STATE NAME=PAUSE MOVE=1 MOVE_SPEED=60                                                                          
        BASE_RESUME                                                                       ; Resume print
    {% endif %}
    M106 S255                                                                                                                      

#######################################################################################################################################################################

[gcode_macro CANCEL_PRINT]
description: Cancel the actual running print
rename_existing: CANCEL_PRINT_BASE
gcode:
  TURN_OFF_HEATERS                                                                        ; Turn off heaters (extruder and bed)
  CANCEL_PRINT_BASE                                                                       ; Run the existing cancel print command
  G91                                                                                     ; Switch to relative positioning
  G1 Z10 F100                                                                             ; Move the Z-axis up 10mm at a feed rate of 100mm/min
  G90                                                                                     ; Switch back to absolute positioning
  G1 X10 F3000                                                                            ; Move the X-axis to X10 at a feed rate of 3000mm/min
  M84                                                                                     ; Disable motors (turn off stepper motors)
  M106 S0                                                                                 ; Turn off cooling fan (if applicable)

#######################################################################################################################################################################

[gcode_macro G29]
description: Perform Z-axis offset
gcode:
    {% if 'x' not in printer.toolhead.homed_axes or 'y' not in printer.toolhead.homed_axes or 'z' not in printer.toolhead.homed_axes %}
    M117 Homing all axes...                                                               ; Display message
    G28                                                                                   ; Home all axes if not already homed
    {% endif %}
    G0 Z10 F1000                                                                          ; Move the Z-axis up to 10mm at a feed rate of 1000mm/min
    G1 X105 Y105 F1000                                                                    ; Move the printhead to X105 Y105 at a feed rate of 1000mm/min (to a specific point for probing)
    PROBE_CALIBRATE                                                                       ; Perform probe calibration (e.g., mesh bed leveling or probe offset calibration)

#######################################################################################################################################################################

[gcode_macro G30]
gcode:

    {% if 'x' not in printer.toolhead.homed_axes or 'y' not in printer.toolhead.homed_axes or 'z' not in printer.toolhead.homed_axes %}
    M117 Homing all axes...                                                               ; Display message
    G28                                                                                   ; Home all axes if not already homed
    {% endif %}

    BED_MESH_CLEAR                                                                        ; Clear any previously stored bed leveling data
    BED_MESH_CALIBRATE                                                                    ; Perform auto bed leveling (probe the bed and generate a leveling mesh)
    BED_MESH_PROFILE SAVE="JRLanger"                                                       ; Save the generated bed leveling data with a custom profile name ("name" as a placeholder)
#    SAVE_CONFIG                                                                          ; Save the current configuration, including bed leveling data, to the printer's firmware
    BED_MESH_PROFILE LOAD="JRLanger"                                                       ; Load the saved bed leveling profile to apply the leveling mesh to future prints

#######################################################################################################################################################################

[gcode_macro LOAD_FILAMENT]
gcode:
    M104 S220                                                                             ; Set the extruder temperature to 220°C (start heating)
    M105                                                                                  ; Report the current temperature (optional status check)
    M109 S220                                                                             ; Wait until the extruder reaches 220°C
    G91                                                                                   ; Set to relative positioning mode
    G1 E100 F200                                                                          ; Extrude 100mm of filament at a speed of 200mm/min (slow loading of filament)
    G90                                                                                   ; Set back to absolute positioning mode

#######################################################################################################################################################################

[gcode_macro UNLOAD_FILAMENT]
gcode:
    M104 S220                                                                             ; Set the extruder temperature to 220°C (start heating)
    M105                                                                                  ; Report the current temperature (optional status check)
    M109 S220                                                                             ; Wait until the extruder reaches 220°C
    G91                                                                                   ; Set to relative positioning mode
    G1 E30 F3000                                                                          ; Extrude 30mm of filament at a speed of 3000mm/min (to release any grip on the filament)
    G1 E-27 F9000                                                                         ; Retract 27mm of filament at a speed of 9000mm/min (fast retraction)
    M106 S255                                                                             ; Turn the cooling fan to full speed (255/255) to prevent filament melting in the heatbreak
    M104 S62                                                                              ; Set the extruder temperature to 62°C (to cool down the extruder)
    M105                                                                                  ; Report the current temperature (optional status check)
    M109 S62                                                                              ; Wait until the extruder reaches 62°C
    G1 E-50 F300                                                                          ; Slowly retract 50mm of filament at 300mm/min (final retraction)
    M106 S0                                                                               ; Turn off the cooling fan
    M84                                                                                   ; Disable all motors to allow manual filament removal
    SET_HEATER_TEMPERATURE HEATER=extruder TARGET=0                                       ; Set extruder temperature to 0°C (turn off the heater)

#######################################################################################################################################################################

[gcode_macro G40]
gcode:
    ACCELEROMETER_QUERY                                                                   ; Query the accelerometer to gather motion data for calibration
    SET_INPUT_SHAPER SHAPER_FREQ_X=0 SHAPER_FREQ_Y=0                                      ; Set input shaping frequencies to 0 for both X and Y axes (resetting to defaults)

    {% if 'x' not in printer.toolhead.homed_axes or 'y' not in printer.toolhead.homed_axes or 'z' not in printer.toolhead.homed_axes %}
    M117 Homing all axes...                                                               ; Display message
    G28                                                                                   ; Home all axes if not already homed
    {% endif %}

    M106 S255                                                                             ; Turn on the cooling fan at full speed (S255 is the maximum speed)
    SHAPER_CALIBRATE                                                                      ; Call the SHAPER_CALIBRATE macro to perform input shaping calibration
    SAVE_CONFIG                                                                           ; Save the configuration to retain the current settings

#######################################################################################################################################################################

[gcode_macro SHAPER_CALIBRATE]
rename_existing: RESHAPER_CALIBRATE                                                       ; Rename the existing RESHAPER_CALIBRATE function to be used in this macro
gcode:
     RESHAPER_CALIBRATE FREQ_START=5 FREQ_END=100                                         ; Start the calibration with a frequency range between 5 and 100 Hz

#######################################################################################################################################################################

[gcode_macro BED_TRAM]
description: Probe the bed above each bed screw and then provide amount to turn each bed screw clockwise or counter clockwise to tram the bed. Repeat the processes as needed and update the bed mesh after.
#rename_existing: SCREWS_TILT_CALCULATE_BASE
variable_bed_temp: 0

gcode:
    {% if 'x' not in printer.toolhead.homed_axes or 'y' not in printer.toolhead.homed_axes or 'z' not in printer.toolhead.homed_axes %}
    M117 Homing all axes...                                                               ; Display message
    G28                                                                                   ; Home all axes if not already homed
    {% endif %}
    
    {% if params.BED_TEMP is defined %}                                                   ; If a bed temperature was provided:
        DISPLAY_MESSAGE MESSAGE="Bed temperature set, heating."                           ; Display message in Console
        M140 S{params.BED_TEMP}                                                           ; Set bed temperature
        M190 S{params.BED_TEMP}                                                           ; Wait for bed to reach temperature
    {% endif %}

    SCREWS_TILT_CALCULATE                                                                 ; Probe the bed
    G1 X2 Y2 Z100 F3000                                                                   ; Move to above screw 1 and lower bed to Z=100 to make it easier to adjust the screws
    DISPLAY_MESSAGE MESSAGE="Probing finished, adjust the screws as needed."              ; Display message in Console

#######################################################################################################################################################################

[gcode_macro DISPLAY_MESSAGE]
description: Allows for messages to be displayed in the Console in specific times during the execution of other Macros. Use by adding: DISPLAY_MESSAGE MESSAGE="Whatever message you want" to other macros.
gcode:
    { action_respond_info(params.MESSAGE) }