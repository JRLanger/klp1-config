#######################################################################################################################################################################
# PRINT START / END / CANCEL
#######################################################################################################################################################################

[gcode_macro START_PRINT]
description: Heat, home, mesh, purge. ADAPTIVE=(1) probes only the print area; ADAPTIVE=0 loads MESH=(JRLanger)
gcode:
    {% set BED_TEMP = params.BED_TEMP|default(60)|float %}
    {% set EXTRUDER_TEMP = params.EXTRUDER_TEMP|default(220)|float %}
    {% set PREHEAT = [EXTRUDER_TEMP, 150]|min %}
    {% set MESH = params.MESH|default("JRLanger") %}
    {% set ADAPTIVE = (params.ADAPTIVE|default("1")|string) != "0" %}  ; empty counts as on
    {% set MAT = params.MATERIAL|default("PLA")|upper %}

    {% if params.BED_TEMP is not defined or params.EXTRUDER_TEMP is not defined %}
        DISPLAY_MESSAGE MESSAGE="WARNING: slicer did not pass temps. Using bed {BED_TEMP} / nozzle {EXTRUDER_TEMP}."
    {% endif %}

    SET_GCODE_VARIABLE MACRO=_MAT VARIABLE=current VALUE="'{MAT}'"   ; remember material for bare M600/LOAD/UNLOAD
    CLEAR_PAUSE
    _PAUSE_RESET

    M117 Heating bed...
    M104 S{PREHEAT}                                     ; warm nozzle, below ooze temp
    M190 S{BED_TEMP}                                    ; sets target and waits

    M117 Homing...
    G28                                                 ; home after bed expansion

    {% if ADAPTIVE %}
        BED_MESH_CLEAR
        _ADAPTIVE_MESH                                  ; probe the print area now, use it for this print
    {% elif MESH in printer.bed_mesh.profiles %}
        BED_MESH_PROFILE LOAD={MESH}
    {% else %}
        DISPLAY_MESSAGE MESSAGE="WARNING: mesh profile {MESH} not found. Printing without mesh."
    {% endif %}

    M117 Heating extruder...
    M109 S{EXTRUDER_TEMP}

    M117 Purging...
    G90
    M82                                                 ; purge below uses absolute E
    G92 E0
    G1 Z5 F900                                          ; raise before travel
    G1 X2 Y20 F6000
    G1 Z0.2 F600
    G1 Y175 E15 F1500
    G1 Z0.4 F600
    G1 Y20 E30 F1500
    G1 X5 F6000
    G92 E0
    M117 Printing...

#######################################################################################################################################################################

[gcode_macro END_PRINT]
description: Heaters off, retract, park at back
gcode:
    {% set th = printer.toolhead %}
    {% set cur_z = printer.gcode_move.gcode_position.z %}
    {% set z_park = [[cur_z + 10, 200]|max, th.axis_maximum.z - 5]|min %}
    {% set z_park = [z_park, cur_z]|max %}              ; never move down

    M104 S0                                             ; heaters off first
    M140 S0
    M106 S0
    _PAUSE_RESET

    G91
    {% if printer.extruder.can_extrude %}
        G1 E-2 F1800
    {% endif %}
    G90
    G1 Z{z_park} F900
    G1 X{(th.axis_minimum.x + th.axis_maximum.x) / 2} Y{th.axis_maximum.y - 10} F6000
    M84
    M117 Print complete

#######################################################################################################################################################################

[gcode_macro CANCEL_PRINT]
description: Cancel the running print
rename_existing: CANCEL_PRINT_BASE
gcode:
    {% set th = printer.toolhead %}
    {% set cur_z = printer.gcode_move.gcode_position.z %}
    {% set z_up = [[cur_z + 10, th.axis_maximum.z - 5]|min, cur_z]|max %}
    {% set can_e = printer.extruder.can_extrude %}

    TURN_OFF_HEATERS
    M106 S0
    _PAUSE_RESET
    {% if 'idle_timeout' in printer.configfile.settings %}
        SET_IDLE_TIMEOUT TIMEOUT={printer.configfile.settings.idle_timeout.timeout}
    {% else %}
        SET_IDLE_TIMEOUT TIMEOUT=600
    {% endif %}
    CANCEL_PRINT_BASE

    G90
    {% if can_e %}
        M83
        G1 E-2 F1800
        M82
    {% endif %}
    G1 Z{z_up} F900
    G1 X10 Y{th.axis_maximum.y - 10} F6000
    M84

#######################################################################################################################################################################
# PAUSE / RESUME
# RESUME is two-stage: 1st press = reheat + purge, 2nd press = continue print.
#######################################################################################################################################################################

[gcode_macro _PAUSE_CFG]
description: Settings for PAUSE / RESUME
variable_park_x: -1              ; -1 = bed center
variable_park_y: -1              ; -1 = back (max Y minus park_margin)
variable_park_margin: 10         ; mm from max Y
variable_z_lift: 50              ; mm bed drop at pause (clamped)
variable_z_margin: 5             ; stay this far below max Z
variable_retract: 3              ; mm retracted at pause
variable_standby_drop: 60        ; C below print temp while paused (PETG: 70-80)
variable_heater_off_after: 1800  ; s until hotend fully off; 0 = never
variable_purge_x: 5
variable_purge_y: 5
variable_purge_len: 30           ; mm purged on resume (max 50)
variable_purge_speed: 300        ; mm/min
variable_prime_extra: 0.5        ; mm extra prime when back on the print
variable_beep_count: 5           ; total beeps; 0 = none
variable_beep_interval: 120      ; s between reminder beeps
gcode:

[gcode_macro PAUSE]
description: Retract, drop bed, park at back, cool to standby, beep
rename_existing: BASE_PAUSE
gcode:
    {% set cfg = printer['gcode_macro _PAUSE_CFG'] %}
    {% if not printer.pause_resume.is_paused %}
        {% set th = printer.toolhead %}
        {% set room = th.axis_maximum.z - cfg.z_margin - th.position.z %}
        {% set lift = [[params.Z|default(cfg.z_lift)|float, room]|min, 0]|max %}
        {% set px = cfg.park_x if cfg.park_x >= 0 else (th.axis_minimum.x + th.axis_maximum.x) / 2 %}
        {% set py = cfg.park_y if cfg.park_y >= 0 else th.axis_maximum.y - cfg.park_margin %}
        {% set can_e = printer.extruder.can_extrude %}
        SET_GCODE_VARIABLE MACRO=RESUME VARIABLE=zhop VALUE={lift}
        SET_GCODE_VARIABLE MACRO=RESUME VARIABLE=park_z VALUE={printer.gcode_move.gcode_position.z + lift}
        SET_GCODE_VARIABLE MACRO=RESUME VARIABLE=rx VALUE={printer.gcode_move.gcode_position.x}   ; resume point (print pos, pre-hop)
        SET_GCODE_VARIABLE MACRO=RESUME VARIABLE=ry VALUE={printer.gcode_move.gcode_position.y}
        SET_GCODE_VARIABLE MACRO=RESUME VARIABLE=rz VALUE={printer.gcode_move.gcode_position.z}
        SET_GCODE_VARIABLE MACRO=RESUME VARIABLE=etemp VALUE={printer.extruder.target}
        SET_GCODE_VARIABLE MACRO=RESUME VARIABLE=fan VALUE={printer.fan.speed}
        SET_GCODE_VARIABLE MACRO=RESUME VARIABLE=retracted VALUE={cfg.retract if can_e else 0}
        SET_GCODE_VARIABLE MACRO=RESUME VARIABLE=stage VALUE=0
        SAVE_GCODE_STATE NAME=PAUSE
        BASE_PAUSE
        G91
        {% if can_e %}
            G1 E-{cfg.retract} F2100                    ; retract before anything else
        {% endif %}
        G1 Z{lift} F900                                 ; drop bed
        SAVE_GCODE_STATE NAME=PAUSEPARK
        G90
        G1 X{px} Y{py} F6000                            ; park
        {% if printer.extruder.target > 0 %}
            M104 S{[printer.extruder.target - cfg.standby_drop, 0]|max}
            M106 S255                                   ; fan helps cool nozzle
            UPDATE_DELAYED_GCODE ID=_PAUSE_COOL DURATION=5
        {% else %}
            M106 S0
        {% endif %}
        {% if cfg.heater_off_after > 0 %}
            UPDATE_DELAYED_GCODE ID=_PAUSE_HEATER_OFF DURATION={cfg.heater_off_after}
        {% endif %}
        SET_IDLE_TIMEOUT TIMEOUT=43200
        SET_GCODE_VARIABLE MACRO=_PAUSE_BEEP VARIABLE=left VALUE={cfg.beep_count}
        _PAUSE_BEEP
        DISPLAY_MESSAGE MESSAGE="Paused. RESUME = heat and purge."
    {% endif %}

[gcode_macro RESUME]
description: 1st = heat and purge, 2nd = continue print
rename_existing: BASE_RESUME
variable_zhop: 0
variable_park_z: 0
variable_rx: 0
variable_ry: 0
variable_rz: 0
variable_etemp: 0
variable_fan: 0
variable_retracted: 0
variable_stage: 0
gcode:
    {% set cfg = printer['gcode_macro _PAUSE_CFG'] %}
    {% if printer.pause_resume.is_paused %}
        {% if stage == 0 %}
            _PAUSE_RESET
            M106 S0
            {% if etemp > 0 %}
                DISPLAY_MESSAGE MESSAGE="Heating..."
                M109 S{etemp}
            {% endif %}
            _PAUSE_PURGE
            SET_GCODE_VARIABLE MACRO=RESUME VARIABLE=stage VALUE=1
            DISPLAY_MESSAGE MESSAGE="Clean the nozzle, then RESUME again. _PAUSE_PURGE for more."
        {% else %}
            {% if 'idle_timeout' in printer.configfile.settings %}
                SET_IDLE_TIMEOUT TIMEOUT={printer.configfile.settings.idle_timeout.timeout}
            {% else %}
                SET_IDLE_TIMEOUT TIMEOUT=600
            {% endif %}
            {% if etemp > 0 %}
                M109 S{etemp}                           ; ensure full print temp
            {% endif %}
            G90
            M83
            G1 Z{park_z} F900                           ; safe height before any XY move
            G1 X{cfg.purge_x} Y{cfg.purge_y} F6000      ; go to purge corner, away from the print
            G1 E5 F{cfg.purge_speed}                    ; fresh purge: dump the oozed/cold tip
            G1 E-{cfg.retract} F2100                    ; retract BEFORE the travel back (kills ooze in transit)
            G1 X{cfg.purge_x + 20} F4000                ; wipe sideways to shear the string
            M400
            G1 X{rx} Y{ry} F6000                        ; travel back OVER the print at safe Z, retracted
            G1 Z{rz} F900                               ; descend straight down onto the resume point
            G1 E{cfg.retract + cfg.prime_extra} F300    ; unretract + tiny prime, at the spot
            M400
            RESTORE_GCODE_STATE NAME=PAUSE MOVE=0        ; restore modal/extruder state only (already positioned)
            M106 S{(fan * 255)|round|int}
            SET_GCODE_VARIABLE MACRO=RESUME VARIABLE=stage VALUE=0
            SET_GCODE_VARIABLE MACRO=RESUME VARIABLE=retracted VALUE=0
            BASE_RESUME
        {% endif %}
    {% endif %}

[gcode_macro _PAUSE_PURGE]
description: Purge at purge position while paused
gcode:
    {% set cfg = printer['gcode_macro _PAUSE_CFG'] %}
    {% set r = printer['gcode_macro RESUME'].retracted %}
    {% set len = [params.LENGTH|default(cfg.purge_len)|float, 45]|min %}
    {% if not printer.pause_resume.is_paused %}
        DISPLAY_MESSAGE MESSAGE="Not paused."
    {% elif not printer.extruder.can_extrude %}
        DISPLAY_MESSAGE MESSAGE="Hotend too cold to purge."
    {% else %}
        SAVE_GCODE_STATE NAME=PAUSE_PURGE
        G90
        G1 X{cfg.purge_x} Y{cfg.purge_y} F6000
        M83
        G1 E{r + len} F{cfg.purge_speed}
        G1 E-1 F2100                                    ; anti-string
        M400
        SET_GCODE_VARIABLE MACRO=RESUME VARIABLE=retracted VALUE=1
        RESTORE_GCODE_STATE NAME=PAUSE_PURGE
    {% endif %}

[gcode_macro _PAUSE_RESET]
description: Stop pause timers and reset pause stage
gcode:
    UPDATE_DELAYED_GCODE ID=_PAUSE_HEATER_OFF DURATION=0
    UPDATE_DELAYED_GCODE ID=_PAUSE_COOL DURATION=0
    UPDATE_DELAYED_GCODE ID=_PAUSE_BEEP_LOOP DURATION=0
    SET_GCODE_VARIABLE MACRO=_PAUSE_BEEP VARIABLE=left VALUE=0
    SET_GCODE_VARIABLE MACRO=RESUME VARIABLE=stage VALUE=0

[gcode_macro _PAUSE_BEEP]
variable_left: 0
gcode:
    {% set cfg = printer['gcode_macro _PAUSE_CFG'] %}
    {% if printer.pause_resume.is_paused and left > 0 %}
        {% if 'gcode_macro M300' in printer %}
            M300 S1000 P1000
            G4 P200
            M300 S1000 P1000
            G4 P200
            M300 S1000 P1000
        {% endif %}
        SET_GCODE_VARIABLE MACRO=_PAUSE_BEEP VARIABLE=left VALUE={left - 1}
        UPDATE_DELAYED_GCODE ID=_PAUSE_BEEP_LOOP DURATION={cfg.beep_interval}
    {% endif %}

[delayed_gcode _PAUSE_BEEP_LOOP]
gcode:
    _PAUSE_BEEP

[delayed_gcode _PAUSE_COOL]
gcode:
    {% set ex = printer.extruder %}
    {% if printer.pause_resume.is_paused %}
        {% if ex.temperature <= [ex.target, 50]|max + 5 %}
            M106 S0
        {% else %}
            UPDATE_DELAYED_GCODE ID=_PAUSE_COOL DURATION=5
        {% endif %}
    {% endif %}

[delayed_gcode _PAUSE_HEATER_OFF]
gcode:
    {% if printer.pause_resume.is_paused %}
        M104 S0
        DISPLAY_MESSAGE MESSAGE="Hotend off after long pause. RESUME reheats."
    {% endif %}

[gcode_macro M300]
description: Beep. S=frequency(Hz) P=duration(ms)
gcode:
    {% set s = params.S|default(1000)|int %}
    {% set p = params.P|default(100)|int %}
    SET_PIN PIN=beeper VALUE=0.5 CYCLE_TIME={1.0 / s}
    G4 P{p}
    SET_PIN PIN=beeper VALUE=0

# Uncomment if the slicer inserts M601 for "pause at layer".
#[gcode_macro M601]
#gcode:
#    PAUSE

#######################################################################################################################################################################
# FILAMENT CHANGE (M600)
#######################################################################################################################################################################

# Fluidd-native flow (no popup): M600 pauses + ejects, then use the macro
# buttons and the Resume button.
#   1. M600 (or slicer at layer) -> pauses, parks, ejects old filament.
#   2. Insert new filament, click the LOAD_FILAMENT macro button.
#   3. Press RESUME -> reheats + purges. Clean the nozzle.
#   4. (optional) _PAUSE_PURGE for more purge until color runs clean.
#   5. Press RESUME again -> continues the print.
[gcode_macro M600]
description: Filament change: pause, eject, then LOAD_FILAMENT + Resume. MATERIAL=PLA|PETG|ABS (PLA)
gcode:
    {% set mat = params.MATERIAL|default(printer['gcode_macro _MAT'].current) %}
    PAUSE                                               ; retract, drop bed, park, standby
    UNLOAD_FILAMENT MODE=change MATERIAL={mat}          ; fast hot eject, stays warm for LOAD (no cold-pull wait)
    DISPLAY_MESSAGE MESSAGE="Filament change ({mat}): insert new filament, click LOAD_FILAMENT MATERIAL={mat}, then RESUME (purges). Clean nozzle, RESUME again."

#######################################################################################################################################################################
# CALIBRATION
#######################################################################################################################################################################

[gcode_macro CALIBRATE_Z_OFFSET]
description: Interactive probe Z offset at bed center. BED_TEMP= optional
gcode:
    {% set BED_TEMP = params.BED_TEMP|default(0)|float %}
    {% set th = printer.toolhead %}
    {% if BED_TEMP > 0 %}
        M190 S{BED_TEMP}
    {% endif %}
    G28
    BED_MESH_CLEAR                                       ; probe z_offset on bare bed, no mesh compensation
    G90
    G1 Z10 F900
    G1 X{(th.axis_minimum.x + th.axis_maximum.x) / 2} Y{(th.axis_minimum.y + th.axis_maximum.y) / 2} F6000
    PROBE_CALIBRATE
    DISPLAY_MESSAGE MESSAGE="Adjust with TESTZ Z=-0.05, then ACCEPT, then SAVE_CONFIG."

[gcode_macro CALIBRATE_MESH]
description: Heat bed, soak, home, probe mesh, save profile. BED_TEMP= SOAK=(min) PROFILE=
gcode:
    {% set BED_TEMP = params.BED_TEMP|default(60)|float %}
    {% set SOAK = params.SOAK|default(0)|float %}
    {% set PROFILE = params.PROFILE|default("JRLanger") %}
    M190 S{BED_TEMP}
    {% if SOAK > 0 %}
        DISPLAY_MESSAGE MESSAGE="Soaking bed {SOAK} min..."
        G4 P{(SOAK * 60000)|int}
    {% endif %}
    G28
    BED_MESH_CLEAR
    BED_MESH_CALIBRATE PROFILE={PROFILE}
    DISPLAY_MESSAGE MESSAGE="Mesh saved as {PROFILE}. Run SAVE_CONFIG to keep it after restart."

[gcode_macro _ADAPTIVE_MESH]
description: Mesh only the area the print uses (EXCLUDE_OBJECT data). Full mesh if the file has none. MARGIN=(10)
gcode:
    {% set bm = printer.configfile.settings.bed_mesh %}
    {% set margin = params.MARGIN|default(10)|float %}
    {% set minspan = 30 %}                              ; smallest mesh side, mm
    {% set xs = [] %}
    {% set ys = [] %}
    {% for o in printer.exclude_object.objects %}
        {% for p in o.polygon|default([o.center] if o.center is defined else []) %}
            {% set _ = xs.append(p[0]) %}
            {% set _ = ys.append(p[1]) %}
        {% endfor %}
    {% endfor %}
    {% if xs|length == 0 %}
        DISPLAY_MESSAGE MESSAGE="Adaptive mesh: no object data in file, probing the full bed."
        BED_MESH_CALIBRATE PROFILE=adaptive
    {% else %}
        {% set x0 = [xs|min - margin, bm.mesh_min[0]]|max %}   ; clamp to the probe-reachable area
        {% set y0 = [ys|min - margin, bm.mesh_min[1]]|max %}
        {% set x1 = [xs|max + margin, bm.mesh_max[0]]|min %}
        {% set y1 = [ys|max + margin, bm.mesh_max[1]]|min %}
        {% if x1 - x0 < minspan %}
            {% set x0 = [[(x0 + x1 - minspan) / 2, bm.mesh_min[0]]|max, bm.mesh_max[0] - minspan]|min %}
            {% set x1 = x0 + minspan %}
        {% endif %}
        {% if y1 - y0 < minspan %}
            {% set y0 = [[(y0 + y1 - minspan) / 2, bm.mesh_min[1]]|max, bm.mesh_max[1] - minspan]|min %}
            {% set y1 = y0 + minspan %}
        {% endif %}
        {% set step_x = (bm.mesh_max[0] - bm.mesh_min[0]) / (bm.probe_count[0] - 1) %}   ; keep full-mesh density
        {% set step_y = (bm.mesh_max[1] - bm.mesh_min[1]) / (bm.probe_count[1] - 1) %}
        {% set nx = [[((x1 - x0) / step_x)|round(0, 'ceil')|int + 1, 3]|max, bm.probe_count[0]]|min %}
        {% set ny = [[((y1 - y0) / step_y)|round(0, 'ceil')|int + 1, 3]|max, bm.probe_count[1]]|min %}
        DISPLAY_MESSAGE MESSAGE="Adaptive mesh: X{x0|round(1)}-{x1|round(1)} Y{y0|round(1)}-{y1|round(1)}, {nx}x{ny} points"
        BED_MESH_CALIBRATE PROFILE=adaptive MESH_MIN={x0|round(2)},{y0|round(2)} MESH_MAX={x1|round(2)},{y1|round(2)} PROBE_COUNT={nx},{ny}
    {% endif %}

[gcode_macro CALIBRATE_SHAPER]
description: Measure resonances. Review results, then SAVE_CONFIG manually
gcode:
    ACCELEROMETER_QUERY
    G28
    M106 S0                                             ; fan vibration adds noise
    SHAPER_CALIBRATE
    DISPLAY_MESSAGE MESSAGE="Check the suggested shapers above, then run SAVE_CONFIG."

[gcode_macro BED_TRAM]
description: Probe above each bed screw and report adjustments. BED_TEMP= optional
gcode:
    {% if params.BED_TEMP is defined %}
        DISPLAY_MESSAGE MESSAGE="Heating bed..."
        M190 S{params.BED_TEMP|float}
    {% endif %}
    G28                                                 ; home after heating
    SCREWS_TILT_CALCULATE
    G90
    G1 Z100 F900                                        ; drop bed first
    G1 X2 Y2 F6000
    DISPLAY_MESSAGE MESSAGE="Adjust screws, repeat BED_TRAM, then run CALIBRATE_MESH. Bed heater still on."

#######################################################################################################################################################################
# FILAMENT
#######################################################################################################################################################################

[gcode_macro _MAT]
description: Per-material temps (hot = melt temp, pull = cold-pull temp). Edit here.
variable_temps: {"PLA": {"hot": 220, "pull": 90}, "PETG": {"hot": 240, "pull": 110}, "ABS": {"hot": 250, "pull": 120}}
variable_current: "PLA"          ; set by START_PRINT; default for bare M600/LOAD/UNLOAD
gcode:

[gcode_macro LOAD_FILAMENT]
description: Load filament. MATERIAL=PLA|PETG|ABS (PLA), TEMP=, LENGTH= (50)
gcode:
    {% set d = printer['gcode_macro _MAT'].temps %}
    {% set mat = params.MATERIAL|default(printer['gcode_macro _MAT'].current)|upper %}
    {% set m = d[mat] if mat in d else d["PLA"] %}
    {% set TEMP = params.TEMP|default(m.hot)|float %}
    {% set LEN = params.LENGTH|default(50)|float %}
    {% set chunks = (LEN / 45)|round(0, 'ceil')|int %}
    SAVE_GCODE_STATE NAME=LOAD_STATE
    UPDATE_DELAYED_GCODE ID=_PAUSE_HEATER_OFF DURATION=0
    M109 S{TEMP}
    M83
    {% for i in range(chunks) %}
        G1 E{LEN / chunks} F300                         ; split: max_extrude_only_distance
    {% endfor %}
    M400
    RESTORE_GCODE_STATE NAME=LOAD_STATE

[gcode_macro UNLOAD_FILAMENT]
description: Eject filament. MODE=clean(cold-pull)|change(fast hot). MATERIAL=PLA|PETG|ABS, TEMP=, PULL_TEMP=
gcode:
    {% set cfg = printer['gcode_macro _PAUSE_CFG'] %}
    {% set d = printer['gcode_macro _MAT'].temps %}
    {% set mat = params.MATERIAL|default(printer['gcode_macro _MAT'].current)|upper %}
    {% set m = d[mat] if mat in d else d["PLA"] %}
    {% set TEMP = params.TEMP|default(m.hot)|float %}
    {% set PULL = params.PULL_TEMP|default(m.pull)|float %}
    {% set mode = params.MODE|default("clean")|lower %}
    SAVE_GCODE_STATE NAME=UNLOAD_STATE
    UPDATE_DELAYED_GCODE ID=_PAUSE_HEATER_OFF DURATION=0 ; cancel any pending hotend-off
    M109 S{TEMP}
    M83
    G1 E10 F300                                         ; wet/soften the tip
    G1 E-15 F2400                                       ; yank out of the melt zone while hot
    {% if mode == "change" %}
        G1 E-45 F1000                                   ; full retract, stays hot for immediate LOAD
    {% else %}
        M106 S255                                       ; part fan full: blows on nozzle, speeds cooldown a lot
        M104 S{PULL}                                    ; cool toward cold-pull temp
        TEMPERATURE_WAIT SENSOR=extruder MAXIMUM={PULL + 8} ; wait until soft-solid (PULL stays > min_extrude_temp 80)
        M106 S0                                         ; fan off once at pull temp
        G1 E-50 F300                                    ; slow cold pull: clears gears + grabs debris
    {% endif %}
    M400
    RESTORE_GCODE_STATE NAME=UNLOAD_STATE
    {% if mode == "change" and printer.pause_resume.is_paused %}
        M104 S{[TEMP - cfg.standby_drop, 0]|max}        ; idle to standby while swapping (retracted, won't ooze)
    {% elif not printer.pause_resume.is_paused %}
        M104 S0
    {% endif %}
    SET_STEPPER_ENABLE STEPPER=extruder ENABLE=0        ; extruder only, keeps XYZ homed

#######################################################################################################################################################################
# TESTING
#######################################################################################################################################################################

[gcode_macro TEST_MOTION]
description: Motion test, no heating. SPEED=(100) ACCEL=(config) LOOPS=(1) MARGIN=(15) CIRCLES=(3) Z=(1) Z_SPEED=(15)
gcode:
    {% if printer.print_stats.state in ["printing", "paused"] %}
        { action_raise_error("TEST_MOTION is not allowed during a print.") }
    {% endif %}
    {% set th = printer.toolhead %}
    {% set v = [params.SPEED|default(100)|float, th.max_velocity]|min %}  ; mm/s, capped at printer limit
    {% set f = v * 60 %}
    {% set zf = [params.Z_SPEED|default(15)|float, printer.configfile.settings.printer.max_z_velocity]|min * 60 %}
    {% set loops = params.LOOPS|default(1)|int %}
    {% set m = params.MARGIN|default(15)|float %}                          ; keep away from the frame
    {% set circles = params.CIRCLES|default(3)|int %}
    {% set x0 = th.axis_minimum.x + m %}
    {% set x1 = th.axis_maximum.x - m %}
    {% set y0 = th.axis_minimum.y + m %}
    {% set y1 = th.axis_maximum.y - m %}
    {% set cx = (x0 + x1) / 2 %}
    {% set cy = (y0 + y1) / 2 %}
    {% set r = [x1 - x0, y1 - y0]|min / 2 - 5 %}
    {% set zsafe = 10 %}

    {% if "xyz" not in th.homed_axes %}
        G28
    {% endif %}
    SAVE_GCODE_STATE NAME=TEST_MOTION
    {% set accel = params.ACCEL|default(0)|float %}    ; empty or 0 = keep current accel
    {% if accel > 0 %}
        SET_VELOCITY_LIMIT ACCEL={accel}
    {% endif %}
    DISPLAY_MESSAGE MESSAGE="TEST_MOTION: {v|round(0)} mm/s, {loops} loop(s)"
    G90
    G1 Z{zsafe} F{zf}                                   ; lift nozzle clear of the bed
    {% for i in range(loops) %}
        G1 X{cx} Y{cy} F{f}                             ; center
        G1 X{x0} Y{y0}                                  ; four corners
        G1 X{x1} Y{y0}
        G1 X{x1} Y{y1}
        G1 X{x0} Y{y1}
        G1 X{cx} Y{cy}
        G1 X{cx + r} Y{cy}                              ; circles, alternating direction
        {% for c in range(circles) %}
            {% if c is even %}
                G2 X{cx + r} Y{cy} I-{r} J0
            {% else %}
                G3 X{cx + r} Y{cy} I-{r} J0
            {% endif %}
        {% endfor %}
        G1 X{x0} Y{y0}                                  ; square
        G1 X{x1} Y{y0}
        G1 X{x1} Y{y1}
        G1 X{x0} Y{y1}
        G1 X{x0} Y{y0}
        G1 X{x1} Y{y1}                                  ; X pattern
        G1 X{x0} Y{y1}
        G1 X{x1} Y{y0}
        G1 X{cx} Y{cy}
    {% endfor %}
    {% if params.Z|default(1)|int %}
        G1 Z{th.axis_maximum.z - 10} F{zf}              ; bed fully down
        G1 Z{zsafe} F{zf}                               ; and back up
    {% endif %}
    M400
    SET_VELOCITY_LIMIT ACCEL={printer.configfile.settings.printer.max_accel}
    RESTORE_GCODE_STATE NAME=TEST_MOTION
    DISPLAY_MESSAGE MESSAGE="TEST_MOTION done."

#######################################################################################################################################################################
# UTILITY
#######################################################################################################################################################################

[gcode_macro DISPLAY_MESSAGE]
description: Print a message to the console. MESSAGE="text"
gcode:
    { action_respond_info(params.MESSAGE|default("")) }
