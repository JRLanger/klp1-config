[homing_override]
set_position_z: 0                                                               ; Set initial Z position to 0 for homing sequence
gcode:
    G91                                                                         ; Switch to relative positioning
    G1 Z5 F100                                                                  ; Move Z-axis up 5mm at a feed rate of 100mm/min
    {% set HOME_CUR = 0.500 %}                                                  ; Set home current for sensorless homing (adjustable)
    {% set driver_config = printer.configfile.settings['tmc2209 stepper_x'] %}  ; Get X stepper motor driver config
    {% set RUN_CUR = driver_config.run_current %}                               ; Get the running current value for X stepper motor
    SET_VELOCITY_LIMIT ACCEL=500                                                ; Set velocity limit and acceleration for homing movement
    SET_TMC_CURRENT STEPPER=stepper_x CURRENT={HOME_CUR}                        ; Set X motor current for homing
    SET_TMC_CURRENT STEPPER=stepper_y CURRENT={HOME_CUR}                        ; Set Y motor current for homing
    
    {% if params.X is defined %}                                                ; Check if X parameter is defined
        G28 X F100                                                              ; Home X axis
        G1 X2 F1000                                                             ; Move X axis to X2 at a feed rate of 1000mm/min
    {% endif %}
    
    {% if params.Y is defined %}                                                ; Check if Y parameter is defined
        G28 Y F100                                                              ; Home Y axis
        G1 Y2 F1000                                                             ; Move Y axis to Y2 at a feed rate of 1000mm/min
    {% endif %}
    
    {% if params.Z is defined %}                                                ; Check if Z parameter is defined
        G28 Z F100                                                              ; Home Z axis
    {% endif %}
    
    {% if params.X is undefined %}                                              ; If no X parameter is defined
        {% if params.Y is undefined %}                                          ; If no Y parameter is defined
            {% if params.Z is undefined %}                                      ; If no Z parameter is defined
                G28 X F100                                                      ; Home X axis
                G28 Y F100                                                      ; Home Y axis
                G1 X2 F2000                                                     ; Move X axis to X2 at a feed rate of 2000mm/min
                G1 Y20 F1000                                                    ; Move Y axis to Y20 at a feed rate of 1000mm/min
                G28 Z F100                                                      ; Home Z axis
                G1 Z10 F100                                                     ; Move Z axis to 10mm at a feed rate of 100mm/min
            {% endif %}
        {% endif %}
    {% endif %}
    
    SET_TMC_CURRENT STEPPER=stepper_x CURRENT={RUN_CUR}                         ; Restore the running current for X motor
    SET_TMC_CURRENT STEPPER=stepper_y CURRENT={RUN_CUR}                         ; Restore the running current for Y motor
    SET_VELOCITY_LIMIT ACCEL=5000                                               ; Restore velocity limit for regular printing
    G90                                                                         ; Switch back to absolute positioning
    BED_MESH_PROFILE LOAD=default                                               ; Load the default bed mesh profile
