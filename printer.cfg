#######################################################################################################################################################################
# KINGROON KLP1 V2.2
#######################################################################################################################################################################

[include mainsail.cfg]                                                            ; Include the Mainsail configuration file
[include MKS_THR.cfg]                                                             ; Include the MKS_THR-specific configuration
[include macros.cfg]                                                              ; Include macros configuration file
[include homing_override.cfg]                                                     ; Include homing override settings

[mcu]                                                                             ; Microcontroller settings
serial:/dev/serial/by-id/usb-Klipper_stm32f103xe_501F30363239391938393736-if00
restart_method: command                                                           ; MCU restart method

[printer]                                                                         ; General printer settings
kinematics: corexy                                                                ; CoreXY kinematics configuration
max_velocity: 500                                                                 ; Maximum movement speed (mm/s)
max_accel: 20000                                                                  ; Maximum acceleration (mm/s²)
max_accel_to_decel: 6000                                                          ; Acceleration to deceleration limit (mm/s²)
max_z_velocity: 50                                                                ; Maximum Z-axis speed (mm/s)
max_z_accel: 100                                                                  ; Maximum Z-axis acceleration (mm/s²)
square_corner_velocity: 20                                                        ; Speed limit for corners (mm/s)

[stepper_x]                                                                       ; X-axis stepper motor settings
step_pin: PC14                                                                    ; Step pin for X-axis
dir_pin: PC13                                                                     ; Direction pin for X-axis
enable_pin: !PC15                                                                 ; Enable pin for X-axis (inverted)
microsteps: 16                                                                    ; Number of microsteps per step
rotation_distance: 40                                                             ; Distance moved per full rotation (mm)
full_steps_per_rotation: 200                                                      ; Full steps per rotation
endstop_pin: tmc2209_stepper_x:virtual_endstop                                    ; Endstop pin for virtual endstop
position_min: 0                                                                   ; Minimum X-axis position
position_endstop: 0                                                               ; Endstop position for X-axis
position_max: 216                                                                 ; Maximum X-axis position
homing_speed: 50                                                                  ; Speed for homing (mm/s)
homing_retract_dist: 0                                                            ; Retract distance during homing
homing_positive_dir: False                                                        ; Homing direction (False = negative)
step_pulse_duration: 0.000002                                                     ; Duration of step pulse (s)

[stepper_y]                                                                       ; Y-axis stepper motor settings
step_pin: PE5                                                                     ; Step pin for Y-axis
dir_pin: !PE4                                                                     ; Direction pin for Y-axis
enable_pin: !PD14                                                                 ; Enable pin for Y-axis (inverted)
microsteps: 16                                                                    ; Number of microsteps per step
rotation_distance: 40                                                             ; Distance moved per full rotation (mm)
full_steps_per_rotation: 200                                                      ; Full steps per rotation
endstop_pin: tmc2209_stepper_y:virtual_endstop                                    ; Endstop pin for virtual endstop
position_min: 0                                                                   ; Minimum Y-axis position
position_endstop: 0                                                               ; Endstop position for Y-axis
position_max: 210                                                                 ; Maximum Y-axis position
homing_speed: 50                                                                  ; Speed for homing (mm/s)
homing_retract_dist: 0                                                            ; Retract distance during homing
homing_positive_dir: False                                                        ; Homing direction (False = negative)
step_pulse_duration: 0.000002                                                     ; Duration of step pulse (s)

[stepper_z]                                                                       ; Z-axis stepper motor settings
step_pin: PE1                                                                     ; Step pin for Z-axis
dir_pin: PE0                                                                      ; Direction pin for Z-axis
enable_pin: !PE2                                                                  ; Enable pin for Z-axis (inverted)
microsteps: 16                                                                    ; Number of microsteps per step
rotation_distance: 8                                                              ; Distance moved per full rotation (mm)
full_steps_per_rotation: 200                                                      ; Full steps per rotation
gear_ratio: 40:20                                                                 ; Gear reduction ratio
endstop_pin: probe:z_virtual_endstop                                              ; Endstop pin for virtual endstop
position_max: 220                                                                 ; Maximum Z-axis position
position_min: -10                                                                 ; Minimum Z-axis position
homing_speed: 5                                                                   ; Speed for homing (mm/s)
second_homing_speed: 2                                                            ; Secondary homing speed (mm/s)
homing_positive_dir: False                                                        ; Homing direction (False = negative)
step_pulse_duration: 0.000002                                                     ; Duration of step pulse (s)

[tmc2209 stepper_x]                                                               ; TMC2209 driver for X-axis
uart_pin: PE6                                                                     ; UART pin for communication
run_current: 1.0                                                                  ; Operating current (A)
interpolate: True                                                                 ; Enable microstep interpolation
stealthchop_threshold: 0                                                          ; StealthChop mode threshold (speed-dependent)
diag_pin: ^PA14                                                                   ; Diagnostic pin
driver_SGTHRS: 110                                                                ; StallGuard sensitivity

[tmc2209 stepper_y]                                                               ; TMC2209 driver for Y-axis
uart_pin: PE3                                                                     ; UART pin for communication
run_current: 1.0                                                                  ; Operating current (A)
interpolate: True                                                                 ; Enable microstep interpolation
stealthchop_threshold: 0                                                          ; StealthChop mode threshold (speed-dependent)
diag_pin: ^PA15                                                                   ; Diagnostic pin
driver_SGTHRS: 110                                                                ; StallGuard sensitivity

[tmc2209 stepper_z]                                                               ; TMC2209 driver for Z-axis
uart_pin: PB7                                                                     ; UART pin for communication
run_current: 1.0                                                                  ; Operating current (A)
hold_current: 1.0                                                                 ; Hold current (A) when idle
interpolate: True                                                                 ; Enable microstep interpolation
stealthchop_threshold: 0                                                          ; StealthChop mode threshold (speed-dependent)

[extruder]                                                                        ; Extruder configuration
step_pin: MKS_THR:gpio5                                                           ; Step pin for extruder
dir_pin: !MKS_THR:gpio4                                                           ; Direction pin for extruder (inverted)
enable_pin: !MKS_THR:gpio10                                                       ; Enable pin for extruder (inverted)
rotation_distance: 23                                                             ; Distance moved per full rotation (mm)
gear_ratio: 50:10                                                                 ; Gear reduction ratio
microsteps: 16                                                                    ; Number of microsteps per step
full_steps_per_rotation: 200                                                      ; Full steps per rotation
nozzle_diameter: 0.400                                                            ; Nozzle diameter (mm)
filament_diameter: 1.75                                                           ; Filament diameter (mm)
heater_pin: MKS_THR:gpio2                                                         ; Heater control pin
sensor_pin: MKS_THR:gpio26                                                        ; Thermistor pin for temperature sensing
sensor_type: ATC Semitec 104GT-2                                                  ; Thermistor type
min_temp: 0                                                                       ; Minimum allowable temperature (°C)
max_temp: 310                                                                     ; Maximum allowable temperature (°C)
max_power: 1                                                                      ; Maximum power output (fraction)
min_extrude_temp: 60                                                              ; Minimum temperature to allow extrusion (°C)
control: pid                                                                      ; Temperature control method
pid_kp: 19.837                                                                    ; PID proportional gain
pid_ki: 4.723                                                                     ; PID integral gain
pid_kd: 20.829                                                                    ; PID derivative gain
pressure_advance: 0.02                                                            ; Compensation for pressure build-up in the nozzle
pressure_advance_smooth_time: 0.09                                                ; Smoothing time for pressure advance (s)
max_extrude_cross_section: 10                                                     ; Maximum filament cross-sectional area (mm²)
instantaneous_corner_velocity: 20.000                                             ; Max velocity change at corners (mm/s)
max_extrude_only_distance: 100.0                                                  ; Maximum filament extrusion distance (mm)
max_extrude_only_velocity: 5000                                                   ; Maximum extrusion speed (mm/s)
max_extrude_only_accel: 2000                                                      ; Maximum extrusion acceleration (mm/s²)
step_pulse_duration: 0.000002                                                     ; Duration of step pulse (s)

[tmc2209 extruder]                                                                ; TMC2209 driver for extruder
uart_pin: MKS_THR:gpio6                                                           ; UART pin for communication
interpolate: True                                                                 ; Enable microstep interpolation
run_current: 0.9                                                                  ; Operating current (A)
hold_current: 0.9                                                                 ; Hold current (A) when idle
sense_resistor: 0.110                                                             ; Sense resistor value
stealthchop_threshold: 0                                                          ; StealthChop mode threshold (speed-dependent)

[heater_bed]                                                                      ; Heated bed configuration
heater_pin: PA0                                                                   ; Heater control pin
sensor_type: NTC 100K MGB18-104F39050L32                                          ; Thermistor type
sensor_pin: PC0                                                                   ; Thermistor pin for temperature sensing
max_power: 1                                                                      ; Maximum power output (fraction)
min_temp: 0                                                                       ; Minimum allowable temperature (°C)
max_temp: 200                                                                     ; Maximum allowable temperature (°C)

[temperature_sensor mcu_temp]                                                     ; MCU temperature sensor
sensor_type: temperature_mcu                                                      ; Sensor type for MCU temperature
min_temp: 0                                                                       ; Minimum allowable temperature (°C)
max_temp: 100                                                                     ; Maximum allowable temperature (°C)

[temperature_sensor KINGROONpi Pi]                                                ; Host system temperature sensor
sensor_type: temperature_host                                                     ; Sensor type for host system temperature
min_temp: 0                                                                       ; Minimum allowable temperature (°C)
max_temp: 100                                                                     ; Maximum allowable temperature (°C)

[temperature_fan Pi_fan2]                                                         ; Cooling fan for motherboard temperature control
pin: PA2                                                                          ; Fan control pin
kick_start_time: 0.500                                                            ; Initial high-speed time for fan startup (s)
sensor_type: temperature_host                                                     ; Sensor type for fan control
control: watermark                                                                ; Fan control strategy
target_temp: 40.0                                                                 ; Target temperature for fan activation (°C)
min_temp: 0                                                                       ; Minimum allowable temperature (°C)
max_temp: 80                                                                      ; Maximum allowable temperature (°C)
max_speed: 0.75                                                                   ; Maximum fan speed (fraction)
min_speed: 0.1                                                                    ; Minimum fan speed (fraction)

[filament_switch_sensor fila]                                                     ; Filament runout sensor configuration
pause_on_runout: True                                                             ; Pause the printer when filament runs out
runout_gcode:                                                                     ; Commands to execute upon filament runout
    G91                                                                           ; Set relative positioning mode
    G1 Z10                                                                        ; Move the print head up 10 mm
    G90                                                                           ; Set back to absolute positioning mode
    G1 X10 Y10 F3000                                                              ; Move to coordinates (10, 10) at speed 3000 mm/min
    M104 S220                                                                     ; Set extruder temperature to 220°C
    M105                                                                          ; Report current temperature (optional)
    M109 S220                                                                     ; Wait for extruder to reach 220°C
    G91                                                                           ; Set relative positioning mode
    G1 E30 F3000                                                                  ; Extrude 30 mm of filament
    G1 E-27 F9000                                                                 ; Retract 27 mm of filament
    M106 S255                                                                     ; Set cooling fan to maximum speed
    M104 S62                                                                      ; Set extruder temperature to 62°C
    M105                                                                          ; Report current temperature (optional)
    M109 S62                                                                      ; Wait for extruder to reach 62°C
    G1 E-50 F300                                                                  ; Slowly retract 50 mm of filament
    M106 S0                                                                       ; Turn off cooling fan
    SET_HEATER_TEMPERATURE HEATER=extruder TARGET=0                               ; Turn off extruder heater
event_delay: 3.0                                                                  ; Delay (s) before executing runout_gcode
pause_delay: 0.5                                                                  ; Delay (s) before pausing print
switch_pin: PA1                                                                   ; Pin for filament runout detection

[verify_heater extruder]                                                          ; Heater verification for extruder
max_error: 120                                                                    ; Maximum temperature error allowed (°C)
check_gain_time: 120                                                              ; Time to verify heating gain (s)
hysteresis: 10                                                                    ; Temperature fluctuation tolerance (°C)
heating_gain: 2                                                                   ; Minimum heating gain required

[verify_heater heater_bed]                                                        ; Heater verification for bed
max_error: 120                                                                    ; Maximum temperature error allowed (°C)
check_gain_time: 120                                                              ; Time to verify heating gain (s)
hysteresis: 10                                                                    ; Temperature fluctuation tolerance (°C)
heating_gain: 2                                                                   ; Minimum heating gain required

[duplicate_pin_override]                                                          ; Pin override configuration
pins: PB5                                                                         ; List of pins to override

[display]                                                                         ; Display configuration
lcd_type: uc1701                                                                  ; LCD display type
cs_pin: PE11                                                                      ; Chip select pin
a0_pin: PE9                                                                       ; A0 pin
rst_pin: PE10                                                                     ; Reset pin
contrast: 63                                                                      ; Display contrast
encoder_pins: ^PE13,^PE14                                                         ; Pins for rotary encoder
click_pin: ^!PE15                                                                 ; Click button pin
spi_software_miso_pin: PB5                                                        ; Software SPI MISO pin
spi_software_mosi_pin: PB5                                                        ; Software SPI MOSI pin
spi_software_sclk_pin: PB3                                                        ; Software SPI SCLK pin

[output_pin beeper]                                                               ; Buzzer configuration
pin: PC5                                                                          ; Pin for buzzer control

[display_status]                                                                  ; Display status configuration

[neopixel mini12864]                                                              ; Neopixel RGB LED configuration
pin: PE12                                                                         ; Data pin for Neopixel
chain_count: 3                                                                    ; Number of LEDs in the chain
color_order: RGB                                                                  ; LED color order
initial_RED: 1.0                                                                  ; Initial brightness for red (0.0–1.0)
initial_GREEN: 1.0                                                                ; Initial brightness for green (0.0–1.0)
initial_BLUE: 0.0                                                                 ; Initial brightness for blue (0.0–1.0)

[probe]                                                                           ; Probe configuration for bed leveling
pin: !MKS_THR:gpio21                                                              ; Probe pin (inverted)
x_offset: 12.85                                                                   ; X-axis offset of the probe from the nozzle (mm)
y_offset: 0                                                                       ; Y-axis offset of the probe from the nozzle (mm)
speed: 5                                                                          ; Speed for probing (mm/s)
samples: 3                                                                        ; Number of samples per probe point
samples_result: median                                                            ; Method to calculate probe result
sample_retract_dist: 1.2                                                          ; Retract distance between probe samples (mm)
samples_tolerance: 0.05                                                           ; Allowable tolerance between samples (mm)
samples_tolerance_retries: 3                                                      ; Retries if samples exceed tolerance

[screws_tilt_adjust]                                                              ; Bed screw tilt adjustment configuration
screw1: 9, 19                                                                     ; Coordinates of front-left screw
screw1_name: front_left                                                           ; Name for front-left screw
screw2: 179, 19                                                                   ; Coordinates of front-right screw
screw2_name: front_right                                                          ; Name for front-right screw
screw3: 179, 189                                                                  ; Coordinates of back-right screw
screw3_name: back_right                                                           ; Name for back-right screw
screw4: 9, 189                                                                    ; Coordinates of back-left screw
screw4_name: back_left                                                            ; Name for back-left screw
speed: 2000                                                                       ; Adjustment speed (mm/s)
horizontal_move_z: 5                                                              ; Z-axis lift height during adjustment (mm)
screw_thread: CCW-M4                                                              ; Screw thread type

[bed_mesh]                                                                        ; Bed mesh leveling configuration
speed: 50                                                                         ; Speed (mm/s) for probing during mesh generation
horizontal_move_z: 5                                                              ; Z-axis lift height (mm) during horizontal moves between probe points
mesh_min: 14, 2                                                                   ; Minimum X, Y coordinates for the mesh area
mesh_max: 212, 208                                                                ; Maximum X, Y coordinates for the mesh area
probe_count: 5, 5                                                                 ; Number of probe points in X and Y directions
split_delta_z: 0.025                                                              ; Maximum allowed height difference (mm) for mesh splitting
move_check_distance: 5.0                                                          ; Distance (mm) to check during probe moves
mesh_pps: 3, 3                                                                    ; Points per segment in X and Y directions for the interpolated mesh
algorithm: lagrange                                                               ; Interpolation algorithm used for generating the bed mesh

[resonance_tester]                                                                ; Resonance testing for input shaper
accel_chip: adxl345                                                               ; Accelerometer chip model
probe_points: 100, 100, 20                                                        ; Probe position for resonance testing
accel_per_hz: 300                                                                 ; Accelerometer data rate

[adxl345]                                                                         ; Accelerometer configuration
cs_pin: MKS_THR:gpio13                                                            ; Chip select pin
spi_software_sclk_pin: MKS_THR:gpio14                                             ; SPI clock pin
spi_software_mosi_pin: MKS_THR:gpio15                                             ; SPI MOSI pin
spi_software_miso_pin: MKS_THR:gpio12                                             ; SPI MISO pin

[input_shaper]                                                                    ; Input shaper configuration
#shaper_freq_x: 52.6                                                              ; Shaper frequency for X-axis
#shaper_type_x: mzv                                                               ; Shaper type for X-axis
#shaper_freq_y: 43.4                                                              ; Shaper frequency for Y-axis
#shaper_type_y: mzv                                                               ; Shaper type for Y-axis

[gcode_arcs]                                                                      ; Arc commands support
resolution: 0.1                                                                   ; Resolution for G2/G3 arcs (mm)

[idle_timeout]                                                                    ; Idle timeout settings
timeout: 36000                                                                    ; Time before idle timeout (s)

[virtual_sdcard]                                                                  ; Virtual SD card configuration
path: /home/mks/printer_data/gcodes                                               ; Path to the directory containing G-code files

[pause_resume]                                                                    ; Pause and resume functionality

[exclude_object]                                                                  ; Exclude object functionality

